{% extends "base.html" %}

{% block title %}Edit Post - Mini Blog{% endblock %}

{% block content %}
<section class="form-container">
    <h1>Edit Post</h1>
    <form action="/post/{{ post.id }}/edit" method="POST" class="post-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ post.title }}" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10" required>{{ post.content }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/post/{{ post.id }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

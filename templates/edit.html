{% extends "base.html" %}

{% block title %}Edit Postingan - BlogRust{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Edit Postingan</h1>
        <p class="text-slate-500">Perbarui informasi atau konten postingan Anda.</p>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
        <form action="/post/{{ post.id }}/edit" method="POST" class="p-6 sm:p-10 space-y-6">
            <div>
                <label for="title" class="block text-sm font-bold text-slate-700 mb-2">Judul Postingan</label>
                <input type="text" id="title" name="title" value="{{ post.title }}" required 
                    class="block w-full rounded-xl border border-slate-300 px-4 py-3 placeholder-slate-400 focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm transition-all shadow-sm">
            </div>

            <div>
                <label for="content" class="block text-sm font-bold text-slate-700 mb-2">Konten</label>
                <textarea id="content" name="content" rows="12" required 
                    class="block w-full rounded-xl border border-slate-300 px-4 py-3 placeholder-slate-400 focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm transition-all shadow-sm resize-none">{{ post.content }}</textarea>
            </div>

            <div class="pt-4 flex flex-col sm:flex-row gap-3">
                <button type="submit" class="btn btn-primary h-12 px-8 flex-grow sm:flex-grow-0">
                    Simpan Perubahan
                </button>
                <a href="/post/{{ post.id }}" class="btn btn-secondary h-12 px-8 text-center font-semibold">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Daftar - BlogRust{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold tracking-tight text-slate-900">Buat akun baru</h2>
        <p class="mt-2 text-center text-sm text-slate-600">
            Sudah punya akun?
            <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500"> masuk di sini </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white px-4 py-8 border border-slate-200 shadow-sm sm:rounded-3xl sm:px-10">
            <form class="space-y-6" action="/register" method="POST">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700"> Username </label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required class="block w-full appearance-none rounded-xl border border-slate-300 px-3 py-2 placeholder-slate-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700"> Password </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required class="block w-full appearance-none rounded-xl border border-slate-300 px-3 py-2 placeholder-slate-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary w-full h-11">Daftar Sekarang</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

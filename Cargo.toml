[package]
name = "rust-blog"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "migration"]

[dependencies]

migration = { path = "./migration" }
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
sea-orm = { version = "1.1.20", features = ["runtime-tokio-rustls", "sqlx-mysql", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tera = "1.20.1"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
jsonwebtoken = "10.3.0"
bcrypt = "0.19.0"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
async-trait = "0.1.89"
